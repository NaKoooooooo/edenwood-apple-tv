<!DOCTYPE html>
<html lang="fr">

<meta charset="utf-8">
<title>Edenwood Apple TV</title>
<meta name="viewport" content="width=1920, initial-scale=1">

<link rel="stylesheet" href="style.css?v=1.2.0">

<body class="chargement">

<div id="fond" class="fond"></div>
<div class="fond-voile"></div>

<div id="app" class="app">

  <div class="scrim-haut"></div>

  <!-- ============ EN-TÊTE ============ -->
  <header class="entete" id="entete">
    <div class="entete-gauche">
      <img class="logo" src="assets/logos/edenwood.svg" alt="Edenwood Apple TV" width="232" height="36">
    </div>

    <nav class="onglets" id="onglets" data-nav-row="onglets" aria-label="Sections"></nav>

    <div class="entete-droite">
      <span class="etat-reseau" id="etat-reseau" title="État de la connexion">
        <svg class="ico" aria-hidden="true"><use xlink:href="#i-reseau" href="#i-reseau"></use></svg>
      </span>
      <div class="horloge" id="horloge">
        <span class="heure" id="heure">--:--</span>
        <span class="date" id="date-jour"></span>
      </div>
      <button type="button" class="bouton-icone focusable" id="btn-reglages" data-action="ouvrir-reglages" aria-label="Réglages">
        <svg class="ico" aria-hidden="true"><use xlink:href="#i-reglages" href="#i-reglages"></use></svg>
      </button>
    </div>
  </header>

  <!-- ============ CONTENU ============ -->
  <main class="scene" id="scene">

    <!-- Vue : À la une -->
    <section class="vue" id="vue-alaune" data-vue="alaune">
      <div class="hero" id="banniere">
        <div class="hero-media">
          <div class="hero-img visible" id="hero-a"></div>
          <div class="hero-img" id="hero-b"></div>
        </div>
        <div class="hero-voile-g"></div>
        <div class="hero-voile-b"></div>
        <div class="hero-texte" id="hero-texte">
          <p class="hero-sur"><span class="puce-demo">DÉMO</span><span id="banniere-type">Film</span></p>
          <h1 class="hero-titre" id="banniere-titre">&nbsp;</h1>
          <p class="hero-meta">
            <span id="banniere-annee"></span><i></i><span id="banniere-genre"></span><i></i><span id="banniere-duree"></span>
          </p>
          <p class="hero-synopsis" id="banniere-synopsis"></p>
          <div class="hero-actions" data-nav-row="banniere">
            <button type="button" class="bouton bouton-primaire focusable" id="btn-ouvrir" data-action="hero-lire">
              <svg class="ico" aria-hidden="true"><use xlink:href="#i-lecture" href="#i-lecture"></use></svg><span>Lire</span>
            </button>
            <button type="button" class="bouton bouton-discret focusable" id="btn-hero-favori" data-action="hero-favori">
              <svg class="ico" id="btn-hero-favori-ico" aria-hidden="true"><use xlink:href="#i-etoile-vide" href="#i-etoile-vide"></use></svg>
              <span id="btn-hero-favori-texte">Ajouter aux favoris</span>
            </button>
          </div>
        </div>
      </div>
      <div class="rails" id="rails-alaune"></div>
    </section>

    <section class="vue" id="vue-films" data-vue="films"></section>
    <section class="vue" id="vue-series" data-vue="series"></section>
    <section class="vue" id="vue-favoris" data-vue="favoris"></section>
    <section class="vue" id="vue-apps" data-vue="apps"></section>
    <section class="vue" id="vue-hdmi" data-vue="hdmi"></section>

    <section class="vue" id="vue-reglages" data-vue="reglages">
      <header class="vue-entete">
        <h2 class="vue-titre">Réglages</h2>
        <p class="vue-sous-titre">Gauche et Droite modifient une valeur · OK active · Retour quitte</p>
      </header>
      <div id="reglages-contenu"></div>
    </section>

  </main>

  <footer class="aide" id="aide">
    <span class="aide-item"><b>OK</b>Sélectionner</span>
    <span class="aide-item"><b>Retour</b>Revenir</span>
    <span class="aide-item"><b>1-8</b>Applications</span>
    <span class="aide-note" id="aide-demo"></span>
  </footer>

</div>

<!-- ============ FEUILLE MODALE ============ -->
<div class="modale-fond" id="modale-fond" hidden>
  <div class="modale" id="modale" role="dialog" aria-modal="true" aria-labelledby="modale-titre">
    <div class="modale-visuel" id="modale-visuel"></div>
    <div class="modale-corps">
      <p class="modale-surtitre" id="modale-surtitre"></p>
      <h3 class="modale-titre" id="modale-titre">&nbsp;</h3>
      <p class="modale-meta" id="modale-meta"></p>
      <p class="modale-texte" id="modale-texte"></p>
      <div class="modale-actions" id="modale-actions" data-nav-row="modale"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden><span id="toast-texte"></span></div>

<div class="demarrage" id="demarrage">
  <img src="assets/logos/edenwood.svg" alt="" width="300" height="47">
  <div class="demarrage-barre"><span></span></div>
</div>

<script src="config.js?v=1.2.0"></script>
<script src="app.js?v=1.2.0"></script>
</body>
</html>
